name: Validate Serverlab

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: serverlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-lab/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types and client syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
